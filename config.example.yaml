# lite-cpa example configuration / lite-cpa 示例配置
# Full field reference: AGENTS.md → "Configuring config.yaml"
# 完整字段说明见 AGENTS.md「Configuring config.yaml」
#
# cp config.example.yaml config.yaml
# Enable at least one provider section below.
# 至少启用下面一类 upstream。

host: ""
port: 8317

api-keys:
  - "sk-lite-gateway"

request-retry: 2
debug: false

# Affinity on by default (TTL 600s, skip-retry false). Details in AGENTS.md.
# 亲和默认开启（TTL 600s，失败可换 key）。详见 AGENTS.md。
channel-affinity: [claude, gpt, gemini, grok, glm, kimi, qwen, minimax]
# channel-affinity: false

request-log:
  enabled: false
  backend: "sqlite"          # sqlite | postgres
  retention: "168h"
  store-body: false
  sqlite:
    path: "logs/requests.db"
  # postgres:
  #   dsn: "postgres://litecpa:litecpa@postgres:5432/litecpa?sslmode=disable"

# Provider field order / 字段顺序:
#   name → proxy-url → priority → failover-mode → headers → base-url → api-key → models
# Model-scoped: models[].speed: fast (Anthropic adds speed + fast-mode beta; OpenAI adds service_tier: priority)
# and models[].verbosity: low|medium|high (injected as text.verbosity). Unset blocks client-selected fast tiers.
# Configure only against upstreams that support their native fast tier.

# --- Model verbosity (GPT-5 series / Responses API) ---
# Controls reply length without touching the prompt. Injected as text.verbosity
# when the client did not set it; a client-set value wins. Values: low|medium|high.
# 控制回复篇幅而不改动 prompt；客户端未设置时注入 text.verbosity，已设置则优先。
# 取值 low | medium | high，仅对 openai-response 上游生效。
