# lite-cpa example configuration / lite-cpa 示例配置
# Full field reference: AGENTS.md → "Configuring config.yaml"
# 完整字段说明见 AGENTS.md「Configuring config.yaml」
#
# cp config.example.yaml config.yaml
# Enable at least one provider section below.
# 至少启用下面一类 upstream。
#
# Provider sections are plain terse lists. Each upstream entry is a `- name:`
# item; uncomment (or add) entries to enable them. The four sections are:
#   anthropic-messages    -> upstream Anthropic /v1/messages         (type claude)
#   openai-responses      -> upstream OpenAI /responses              (openai-response)
#   openai-completions    -> upstream OpenAI-compatible /chat/completions (openai)
#   openai-images         -> upstream OpenAI Images API passthrough (no translation)

host: ""
port: 8317

api-keys:
  - "sk-lite-gateway"

request-retry: 2
debug: false

# Affinity on by default (TTL 600s, skip-retry false). Details in AGENTS.md.
# 亲和默认开启（TTL 600s，失败可换 key）。详见 AGENTS.md。
channel-affinity: [claude, gpt, gemini, grok, glm, kimi, qwen, minimax]
# channel-affinity: false

# Optional same-priority reliability-aware key selection.
# 可选的同优先级可靠性自适应选 key。
# Default is priority (historical provider/key order). Use shadow: true to
# collect reliability data without changing selection.
# routing:
#   strategy: priority   # priority | adaptive
#   half-life: 72h
#   shadow: false

request-log:
  enabled: false
  backend: "sqlite"          # sqlite | postgres
  retention: "168h"
  store-body: false
  sqlite:
    path: "logs/requests.db"
  # postgres:
  #   dsn: "postgres://litecpa:litecpa@postgres:5432/litecpa?sslmode=disable"

# --- Provider field order / 字段顺序 ---
#   name → proxy-url → priority → failover-mode → headers → base-url → api-key → models
# Only the fields you need are required; the rest use sane defaults.
# 只有必需字段要填，其余用默认值。

# --- failover-mode ---
#   key      (default) official multi-key; 401/403/429/>=500 + network errors retry
#   provider          relay / 中转站: one failure skips all keys under this name
# Aliases: keys -> key; supplier/site -> provider.

# --- models[].speed / models[].verbosity ---
#   speed: "fast"   model-scoped fast tier. Anthropic adds speed + fast-mode beta;
#                   OpenAI adds service_tier: priority. Empty blocks client fast tiers.
#   verbosity: "low" | "medium" | "high"  (GPT-5 series, injected as text.verbosity
#                   only when the client did not set it). Responses-API upstreams only.
# Configure only against upstreams that support their native fast tier.
#
# --- models[].alias (optional) ---
#   Client-visible id; defaults to name when omitted. Usually you just write
#   `name` and skip alias entirely — only set alias when the client-facing model
#   id differs from the upstream name.
#   客户端可见 id；省略时默认等于 name。一般只写 name，仅当客户端 id 与上游名
#   不一致时才设置 alias。

# ────────────────────────────────────────────────────────────────
